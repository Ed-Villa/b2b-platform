<polygon points="900,640 893.7674679981453,628.5914266954252 906.2325320018547,628.5914266954252" fill="#2563eb"/>
<text x="925" y="619" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="700">No</text>
<rect x="650" y="640" width="500" height="140" rx="18" fill="#eaf1ff" stroke="#b1c7f5" stroke-width="2"/>
<text x="672" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Consultar y enriquecer</text>
<text x="672" y="715.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Cliente válido → productos concurrentes</text>
<text x="672" y="739.5" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Virtual threads · 20 permisos por instancia</text>
<text x="672" y="764.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Cliente inelegible: sin productos</text>
<rect x="1260" y="525" width="490" height="240" rx="18" fill="#fff5e9" stroke="#e2c39a" stroke-width="2"/>
<text x="1282" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Política HTTP</text>
<text x="1282" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Conexión: 1 s · respuesta: 2 s</text>
<text x="1282" y="628" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Timeout / 429 / 500 / 502 / 503: retry</text>
<text x="1282" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">3 intentos; permiso incluye backoff</text>
<text x="1282" y="684" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Otros errores / respuesta inválida:</text>
<text x="1282" y="712" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">TECHNICAL_FAILURE sin retry</text>
<text x="1282" y="740" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Agotamiento: TECHNICAL_FAILURE</text>
<polyline points="1150,710 1260,710" fill="none" stroke="#087f8c" stroke-width="3"/>
<polygon points="1260,710 1248.591426695425,716.2325320018547 1248.591426695425,703.7674679981453" fill="#087f8c"/>
<polyline points="900,780 900,825" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="900,825 893.7674679981453,813.5914266954252 906.2325320018547,813.5914266954252" fill="#2563eb"/>
<rect x="650" y="825" width="500" height="140" rx="18" fill="#ffffff" stroke="#d5deea" stroke-width="2"/>
<text x="672" y="864" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Preparar resultado</text>
<text x="672" y="900.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Elegibilidad, descuento e impuestos</text>
<text x="672" y="924.5" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">APPROVED / REJECTED / TECHNICAL_FAILURE</text>
<text x="672" y="949.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Rechazos y fallos: totales nulos</text>
<polyline points="900,965 900,1020" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="900,1020 893.7674679981453,1008.5914266954252 906.2325320018547,1008.5914266954252" fill="#2563eb"/>
<rect x="650" y="1020" width="500" height="160" rx="18" fill="#eaf1ff" stroke="#b1c7f5" stroke-width="2"/>
<text x="672" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Guardar con transacción MongoDB</text>
<text x="672" y="1095.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Revalidar identidad y revisión atómicamente</text>
<text x="672" y="1118.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Inbox + revisión + pedido + outbox</text>
<text x="672" y="1141.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Restricciones únicas y actualización por versión</text>
<text x="672" y="1164.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">readConcern snapshot · writeConcern majority</text>
<rect x="1260" y="865" width="490" height="330" rx="18" fill="#e8f7f5" stroke="#91cdc5" stroke-width="2"/>
<text x="1282" y="904" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Decisión atómica, en este orden</text>
<text x="1282" y="940" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">1. Mismo eventId: no crear otro efecto</text>
<text x="1282" y="968" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">2. Orden/revisión ocupada: conflicto → DLT</text>
<text x="1282" y="996" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">3. Revisión inferior: inbox OBSOLETE</text>
<text x="1282" y="1024" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">4. Revisión nueva: persistir resultado y salida</text>
<text x="1282" y="1052" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400"></text>
<text x="1282" y="1080" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">APPROVED / REJECTED → processed.v1</text>
<text x="1282" y="1108" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">TECHNICAL_FAILURE → processing.dlt</text>
<text x="1282" y="1136" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Conflicto/obsoleto: no reemplazar pedido</text>
<polyline points="1150,1100 1260,1100" fill="none" stroke="#087f8c" stroke-width="3"/>
<polygon points="1260,1100 1248.591426695425,1106.2325320018547 1248.591426695425,1093.7674679981453" fill="#087f8c"/>
<polyline points="900,1180 900,1240" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="900,1240 893.7674679981453,1228.591426695425 906.2325320018547,1228.591426695425" fill="#2563eb"/>
<polygon points="900,1240 1150,1300 900,1360 650,1300" fill="#eaf1ff" stroke="#9bb8ec" stroke-width="2"/>
<text x="725" y="1301" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#2563eb" font-weight="700">¿Guardado confirmado?</text>
<text x="760" y="1321" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#52677d" font-weight="400">Incluye disposición sin nuevo efecto</text>
<rect x="70" y="1225" width="420" height="155" rx="18" fill="#fff5e9" stroke="#e2c39a" stroke-width="2"/>
<text x="92" y="1264" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Fallo de persistencia</text>
<text x="92" y="1300" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">No confirmar offset</text>
<text x="92" y="1328" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Reintentar / reentregar mensaje</text>
<text x="92" y="1356" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Reevaluar conflictos transaccionales</text>
<polyline points="650,1300 490,1300" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="490,1300 501.4085733045748,1293.7674679981453 501.4085733045749,1306.2325320018547" fill="#2563eb"/>
<text x="545" y="1284" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="700">No</text>
<polyline points="900,1360 900,1410" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="900,1410 893.7674679981453,1398.591426695425 906.2325320018547,1398.591426695425" fill="#2563eb"/>
<text x="925" y="1390" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="700">Sí</text>
<rect x="650" y="1410" width="500" height="100" rx="18" fill="#e8f7f5" stroke="#91cdc5" stroke-width="2"/>
<text x="672" y="1449" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Confirmar offset de Kafka</text>
<text x="672" y="1485.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">El publicador entrega la outbox por separado</text>
<text x="70" y="1578" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#52677d" font-weight="400">Las rutas inválida y duplicada también confirman el offset, después de comprobar su disposición duradera.</text>
</svg>