<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1620" viewBox="0 0 1800 1620"><rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="50" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="42" fill="#142b45" font-weight="700">Flujo de procesamiento del pedido</text>
<text x="52" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#52677d" font-weight="400">eventVersion = esquema (1) · orderVersion = revisión de la orden · tópico .v1 = esquema v1</text>
<rect x="650" y="155" width="500" height="100" rx="18" fill="#eaf1ff" stroke="#b1c7f5" stroke-width="2"/>
<text x="672" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Recibir orders.created.v1</text>
<text x="672" y="230.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">OrderListener · conservar fuente y mensaje</text>
<polyline points="900,255 900,295" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="900,295 893.7674679981453,283.5914266954252 906.2325320018547,283.5914266954251" fill="#2563eb"/>
<polygon points="900,295 1150,355 900,415 650,355" fill="#eaf1ff" stroke="#9bb8ec" stroke-width="2"/>
<text x="725" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#2563eb" font-weight="700">¿Entrada válida?</text>
<text x="760" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#52677d" font-weight="400">DTO → dominio + reglas mínimas</text>
<polyline points="650,355 490,355" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="490,355 501.4085733045748,348.7674679981454 501.4085733045749,361.2325320018546" fill="#2563eb"/>
<text x="545" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="700">No</text>
<rect x="70" y="285" width="420" height="150" rx="18" fill="#fff5e9" stroke="#e2c39a" stroke-width="2"/>
<text x="92" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Registrar entrada inválida</text>
<text x="92" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Transacción: inbox INVALID + outbox DLT</text>
<text x="92" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Sin pedido procesado</text>
<text x="92" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Conservar mensaje original</text>
<polyline points="70,355 35,355 35,1470 650,1470" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="650,1470 638.5914266954252,1476.2325320018547 638.5914266954252,1463.7674679981453" fill="#2563eb"/>
<polyline points="900,415 900,470" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="900,470 893.7674679981453,458.5914266954252 906.2325320018547,458.5914266954251" fill="#2563eb"/>
<text x="925" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="700">Sí</text>
<polygon points="900,470 1150,530 900,590 650,530" fill="#eaf1ff" stroke="#9bb8ec" stroke-width="2"/>
<text x="725" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#2563eb" font-weight="700">¿eventId ya registrado?</text>
<text x="760" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#52677d" font-weight="400">Consulta rápida de inbox</text>
<polyline points="650,530 490,530" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="490,530 501.4085733045748,523.7674679981453 501.4085733045749,536.2325320018547" fill="#2563eb"/>
<text x="545" y="514" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="700">Sí</text>
<rect x="70" y="460" width="420" height="135" rx="18" fill="#e8f7f5" stroke="#91cdc5" stroke-width="2"/>
<text x="92" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#142b45" font-weight="700">Duplicado conocido</text>
<text x="92" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Sin consultas a proveedores</text>
<text x="92" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#52677d" font-weight="400">Sin nuevo efecto de negocio</text>
<polyline points="280,595 280,665 35,665" fill="none" stroke="#2563eb" stroke-width="3"/>
<polygon points="35,665 46.408573304574844,658.7674679981453 46.408573304574844,671.2325320018547" fill="#2563eb"/>
