name: apex-b2b
services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in orders.created.v1 orders.processed.v1 orders.processing.dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        done
  mongo:
    image: mongo:7.0.18
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7.0.18
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval"]
    command:
      - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; while (!db.hello().isWritablePrimary) { sleep(500) }"
  products-api:
    build: ./products-api
    ports: ["127.0.0.1:8081:8081"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
  clients-api:
    build: ./clients-api
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  order-processor:
    build: ./order-processor
    environment:
      MONGODB_URI: mongodb://mongo:27017/b2b?replicaSet=rs0
      MONGODB_DATABASE: ${MONGODB_DATABASE:-b2b}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CLIENTS_URL: http://clients-api:3000
      PRODUCTS_URL: http://products-api:8081
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      PRODUCTS_CONCURRENCY: ${PRODUCTS_CONCURRENCY:-20}
      OUTBOX_MAX_PERMANENT_FAILURES: ${OUTBOX_MAX_PERMANENT_FAILURES:-3}
      OUTBOX_RETRY_DELAY_MS: ${OUTBOX_RETRY_DELAY_MS:-5000}
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      products-api: {condition: service_healthy}
      clients-api: {condition: service_healthy}
volumes:
  mongo-data:
  kafka-data:
