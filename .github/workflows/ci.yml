name: verify
on: [ push, pull_request ]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: order-processor/pom.xml }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.12', cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: clients-api/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: mvn -B -f order-processor/pom.xml verify
      - run: go test -race ./...
        working-directory: products-api
      - run: npm ci && npm run build && npm test
        working-directory: clients-api
      - run: pip install -r scripts/requirements.txt && python scripts/validate-contracts.py
      - run: docker compose up -d --build
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-evidence, path: "order-processor/target/*-reports/\ncompose.log" }
      - if: always()
        run: docker compose down
